<!DOCTYPE html>
<html lang="ne">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दार्चुला बहुमुखी क्याम्पस | हाजिरी जवाफ पोर्टल</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      var l = window.location;
      // If we are on custom domain, pathSegmentsToKeep is 0. If on github.io/repo, pathSegmentsToKeep is 1.
      if (l.hostname.indexOf('github.io') === -1) {
        pathSegmentsToKeep = 0;
      }

      var base = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/';

      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

      l.replace(base + route + search + l.hash);
    </script>
  </head>
  <body style="background-color: #0f172a; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 1rem;">
    <div>
      <div style="width: 50px; height: 50px; border: 4px solid #334155; border-top-color: #dc2626; border-radius: 50%; margin: 0 auto 1.5rem; animation: spin 1s linear infinite;"></div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      <h2 style="margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 700;">पृष्ठ खुल्दैछ...</h2>
      <p style="color: #94a3b8; margin: 0 0 1.5rem; font-size: 0.95rem;">कृपया केही क्षण प्रतिक्षा गर्नुहोस्...</p>
      <noscript>
        <p style="color: #f87171; margin-bottom: 1rem;">जाभास्क्रिप्ट निष्क्रिय रहेको देखिन्छ।</p>
        <a href="/" style="display: inline-block; background-color: #dc2626; color: white; padding: 0.6rem 1.2rem; border-radius: 9999px; text-decoration: none; font-weight: 600;">गृहपृष्ठमा जानुहोस्</a>
      </noscript>
    </div>
  </body>
</html>
